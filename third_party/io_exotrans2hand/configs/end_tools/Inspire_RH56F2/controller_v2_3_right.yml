enable: True
ros_interface:
  node_name: Finger_Retarget_right
  rate: 100
  sub_topic:
    tf_target: "/io_align/tf_hand"
    joint_state: "/io_teleop/joint_states"
  pub_topic:
    joint_target: "/io_teleop/joint_cmd_finger_right"

model:
  urdf: urdf/RH56F2_dual.urdf
  free_joints: [
                right_thumb_1_joint,
                right_thumb_2_joint,
                right_thumb_3_joint,
                right_thumb_4_joint,
                right_index_1_joint,
                right_index_2_joint,
                right_middle_1_joint,
                right_middle_2_joint,
                right_ring_1_joint,
                right_ring_2_joint,
                right_pinky_1_joint,
                right_pinky_2_joint,
              ]
task:
  pose:
        [
          [["right_hand_ee_link", "right_thumb_tip"], 1, 0, 1.0],
          [["right_hand_ee_link", "right_index_tip"], 1, 0, 1.3],
          [["right_hand_ee_link", "right_middle_tip"], 1, 0, 1.3],
          [["right_hand_ee_link", "right_ring_tip"], 1, 0, 1.3],
          [["right_hand_ee_link", "right_pinky_tip"], 1, 0, 1.3],
        ]
  vector:
          [
            [["right_hand_ee_link", "right_thumb_tip", "right_index_tip"], 0.03, 400, 0],
            [["right_hand_ee_link", "right_thumb_tip", "right_middle_tip"], 0.03, 400, 0],
            [["right_hand_ee_link", "right_thumb_tip", "right_ring_tip"], 0.03, 400, 0],
            [["right_hand_ee_link", "right_thumb_tip", "right_pinky_tip"], 0.03, 400, 0],
          ]
  smooth: 0.1
